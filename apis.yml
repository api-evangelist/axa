description: >-
  AXA is a French multinational insurance firm and one of the world's largest
  providers of life, health, property & casualty, and asset management
  services. AXA does not publish a single global developer portal; technology
  integration is delivered through country-specific broker and partner
  portals, AXA Partners B2B2C distribution channels, AXA XL specialty
  insurance APIs for commercial brokers, and ACORD / EDI standards used
  across the insurance industry.
